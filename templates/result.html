<!DOCTYPE html>
<html>
<head>
    <title>Prediction Result</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2 class="mb-4">Predicted Car Price Interval</h2>
        
        <div class="card">
            <div class="card-body">
                <h1 class="card-title text-success">${{ lower_bound }} - ${{ upper_bound }}</h1>
                <p class="card-text">Based on the features you provided. (Estimated exact price: ${{ predicted_price }})</p>
                <a href="/" class="btn btn-primary">Predict Another Car</a>
            </div>
        </div>
    </div>
</body>
</html>
