<!DOCTYPE html>
<html>
<head>
    <title>Car Price Predictor</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Predict Car Selling Price</h1>
        
        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        
        <form action="/predict" method="POST">
            <div class="mb-3">
                <label class="form-label">Car Name</label>
                <input type="text" class="form-control" name="Car_Name" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Year</label>
                <input type="number" class="form-control" name="Year" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Present Price</label>
                <input type="number" step="0.01" class="form-control" name="Present_Price" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Driven KMs</label>
                <input type="number" class="form-control" name="Driven_kms" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Fuel Type</label>
                <select class="form-select" name="Fuel_Type" required>
                    <option value="">Select</option>
                    <option value="Petrol">Petrol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="CNG">CNG</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Selling Type</label>
                <select class="form-select" name="Selling_type" required>
                    <option value="">Select</option>
                    <option value="Dealer">Dealer</option>
                    <option value="Individual">Individual</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Transmission</label>
                <select class="form-select" name="Transmission" required>
                    <option value="">Select</option>
                    <option value="Manual">Manual</option>
                    <option value="Automatic">Automatic</option>
                </select>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Owner</label>
                <input type="number" class="form-control" name="Owner" min="0" max="3" required>
            </div>
            
            <button type="submit" class="btn btn-primary">Predict Price</button>
        </form>
    </div>
</body>
</html>
